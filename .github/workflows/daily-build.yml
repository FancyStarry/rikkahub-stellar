name: Build & Release

on:
  # 仅由推送触发: 本仓库为个人构建, 每次推送到 master 即出包
  push:
    branches:
      - master
  # 保留手动触发, 便于不产生提交的情况下重跑
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与 Android Studio 自带的 JetBrains Runtime 21 保持一致
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          # jetbrains 安装器通过 GitHub API 查询版本，带上 token 避免被限流
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          # 本仓库已移除 Firebase, 不再需要 google-services.json。
          # 签名 secret 均为可选: 未提供时 release 回退到 debug 签名, 构建仍可完成。
          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          else
            echo "KEY_BASE64 未配置, 使用 debug 签名"
          fi

          if [ -n "${{ secrets.SIGNING_CONFIG }}" ]; then
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          else
            echo "SIGNING_CONFIG 未配置, 使用 debug 签名"
          fi

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease

      - name: Resolve version
        id: version
        run: |
          version=$(grep -m1 -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "解析到版本号: $version"

      # 发布为正式版本: 同一版本号重复推送时, 更新既有 Release 的产物
      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: RikkaHub Stellar v${{ steps.version.outputs.version }}
          prerelease: false
          make_latest: true
          body: |
            RikkaHub Stellar 个人构建, 基于上游 RikkaHub v${{ steps.version.outputs.version }}, 集成 Stellar 特权 API。

            - 提交: `${{ github.sha }}`
            - 包名: `me.rerere.rikkahub.stellar`(可与官方版本并存安装)
            - 相对上游的改动: 见仓库 README
          # mapping.txt 用于还原混淆后的崩溃堆栈，所有 ABI 的 APK 共用这一份
          files: |
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/mapping/githubRelease/mapping.txt
